<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,follow">
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; object-src 'none'"
  >
  <link rel="canonical" href="https://patient.shirabeo.com/">
  <title>Patient Insightへ移動します</title>
  <style>
    body {
      margin: 0;
      padding: 2rem;
      color: #1f2937;
      background: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.7;
    }

    main {
      max-width: 40rem;
      margin: 10vh auto 0;
    }

    h1 {
      margin-bottom: 1rem;
      font-size: 1.5rem;
    }

    a {
      color: #075985;
    }
  </style>
</head>
<body>
  <main>
    <h1>Patient Insightへ移動します</h1>
    <p>自動的に移動しない場合は、次のリンクを選択してください。</p>
    <p>
      <a
        id="manual-link"
        href="https://patient.shirabeo.com/"
        rel="noopener noreferrer"
      >Patient Insightを開く</a>
    </p>
    <noscript>
      <p>自動転送にはJavaScriptが必要です。上のリンクからお進みください。</p>
    </noscript>
  </main>

  <script>
    (() => {
      const destination = new URL("https://patient.shirabeo.com/");
      destination.search = window.location.search;
      destination.hash = window.location.hash;

      const manualLink = document.getElementById("manual-link");
      manualLink.href = destination.href;

      window.location.replace(destination.href);
    })();
  </script>
</body>
</html>
