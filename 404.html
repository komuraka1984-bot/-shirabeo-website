<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    (function () {
      var path = window.location.pathname.replace(/\/+$/, "");


      var demoPath = path.toUpperCase();
      if (demoPath === "/DEMO4" || demoPath === "/DEMO7") {
        window.location.replace("https://shirabeo-booth-agent.komuraka.chatgpt.site/?demo=" + (demoPath === "/DEMO4" ? "patient" : "doctor"));
        return;
      }

      if (path === "/RD4" || path === "/rd4") {
        window.location.replace("https://shirabeo.com/RD4/");
        return;
      }

      if (path === "/RD7" || path === "/rd7") {
        window.location.replace("https://shirabeo.com/RD7/");
        return;
      }

      if (path === "/SC" || path === "/sc") {
        window.location.replace("https://shirabeo.com/SC/");
        return;
      }
    })();
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
